[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledgevault"
version = "0.14.0"
description = "CLI-first personal knowledge base for AI agents — structured, navigable, zero extra cost"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "Eddie Landesberg"}
]
keywords = ["knowledge-graph", "entity-extraction", "llm", "data-processing", "personal-knowledge-base", "pkm", "llm-memory", "agent-memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    # Dev tooling is version-BOUNDED on purpose (2026-07-27).
    #
    # All three of these were unbounded (black>=23.0, ruff>=0.1.0, mypy>=1.0), so
    # CI installed whatever released most recently and drifted out from under the
    # code. Two separate outages resulted: black changed formatting and CI went red
    # on 2026-07-20 (unnoticed for a week), then ruff 0.16 promoted new rules to
    # stable and `ruff check .` reported 538 errors on unchanged code.
    #
    # The black marker is load-bearing: black 26.x requires Python >=3.10, but the
    # CI matrix still tests 3.9, so an unmarked pin breaks `pip install` outright
    # on that job. Only the lint job (3.11) runs black, so restricting it is safe.
    "black>=26.1,<27; python_version>='3.10'",
    "mypy>=1.0,<2",
    "types-PyYAML>=6.0",
    "ruff>=0.14,<0.15",
    "pre-commit>=3.0",
]
mcp = [
    "mcp>=1.0.0; python_version >= '3.10'",
]
[project.scripts]
kvault = "kvault.cli.main:cli"
kvault-mcp = "kvault.mcp.server:main"

[project.urls]
Homepage = "https://github.com/cimo-labs/kvault"
Documentation = "https://github.com/cimo-labs/kvault#readme"
Repository = "https://github.com/cimo-labs/kvault"
Issues = "https://github.com/cimo-labs/kvault/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["kvault*"]

[tool.setuptools.package-data]
kvault = ["templates/**/*", "py.typed"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["kvault"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.mypy]
# 3.10, not 3.9, deliberately. click is an unpinned RUNTIME dependency
# (click>=8.0) and 8.3+ uses `match` statements; with python_version 3.9 mypy
# fails parsing 3.10 syntax inside click itself and aborts before checking any
# of our code (CI red 2026-07-27). Pinning click would be the wrong fix -- it
# constrains what downstream users may install to work around a type-checking
# artefact.
#
# 3.9 compatibility is still enforced, twice over and more meaningfully:
# ruff's target-version = "py39" rejects 3.10+ syntax in our source, and the
# test matrix actually RUNS on 3.9.
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
warn_redundant_casts = true
warn_unused_ignores = false
show_error_codes = true
exclude = ["tests/"]


# Allow more permissive typing for initial release
# TODO: Gradually enable stricter type checking
[[tool.mypy.overrides]]
module = ["kvault.*"]
strict = false
allow_untyped_defs = true
allow_any_generics = true
